<style>
/* Koncept: ena kolona, zavihki zgoraj, velike tipke za dnevni vnos. Gozdno zelena + korala iz podobe skupine. */
:root{
  --bg:#DDE0E7; --surface:#ffffff; --surface-2:#ECEEF3; --fg:#1C1C1E; --muted:#636366; --line:#C4C9D3;
  --primary:#177A4C; --on-primary:#ffffff; --ring:#1E8E5A; --accent:#B5532F; --accent-t:#FBE6DC;
  --done:#177A4C; --done-t:#DDF2E5; --min:#8A5A00; --min-t:#FBEBC8; --rest:#3F6590; --rest-t:#DFE8F4; --miss:#B13E2A; --miss-t:#F8E0D9;
  --on-status:#ffffff; --ring-track:#D8F0E2; --tabbg:rgba(255,255,255,.94); --tabline:#D1D1D6; color-scheme:light;
  --font-head:Inter,-apple-system,'Segoe UI',system-ui,sans-serif;
  --font-body:Inter,-apple-system,'Segoe UI',system-ui,sans-serif;
}

:root[data-theme="dark"]{
  --bg:#070B09; --surface:#222F28; --surface-2:#2D3D34; --fg:#EEF2EE; --muted:#A3B1A8; --line:#3A4D42;
  --primary:#46B886; --on-primary:#062014; --ring:#46B886; --ring-track:#24402F; --accent:#FF8A66; --accent-t:#3A2A24;
  --done:#4CC48A; --done-t:#1C4A36; --min:#E8B04A; --min-t:#4A3B17; --rest:#8FA8C8; --rest-t:#26384D; --miss:#EF7B6C; --miss-t:#4D2723;
  --on-status:#08150E; --tabbg:rgba(7,11,9,.96); --tabline:#3A4D42; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.shell{max-width:560px;margin:0 auto;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-head);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.themebtn{border:0;background:var(--surface);color:var(--fg);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.themebtn svg{width:19px;height:19px}
.brand{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.top h1{font-size:clamp(28px,8vw,34px);font-weight:800;letter-spacing:-.025em}
.toprow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.datelab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block;margin-top:6px}
.streakbox{text-align:right;flex:none}.streakbox b{display:block;font-size:30px;font-weight:800;line-height:1;color:var(--primary);letter-spacing:-.02em;font-variant-numeric:tabular-nums}.streakbox span{display:block;margin-top:3px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.pill.hab{background:var(--accent-t);color:var(--accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:560px;margin:0 auto;background:var(--tabbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:2px solid var(--tabline);box-shadow:0 -4px 14px rgba(0,0,0,.07);display:flex;padding:4px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;padding:8px 2px 6px;margin:4px 2px 0;border-radius:14px;font-weight:600;font-size:11.5px;color:var(--ink)}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--primary);font-weight:800;background:var(--surface2,rgba(30,142,90,.12))}
.tab[aria-selected="true"]{background:rgba(30,142,90,.14)}
.stack{display:flex;flex-direction:column;gap:14px}
:root[data-theme="dark"] .card{border:1px solid #3A4D42;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.card{background:var(--surface);border:0;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.card h3{font-size:16px}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.quote{font-family:var(--font-head);font-size:19px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.plain{background:transparent;padding:2px 4px 0;gap:6px}
.goal{font-size:18px;font-weight:700;line-height:1.35}
.goal-sub{display:flex;flex-direction:column;gap:4px;font-size:15px}
.goal-sub b{font-weight:700}
.banner{border-radius:14px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:2px}
.banner b{font-family:var(--font-head);font-size:16px}
.banner.warn{background:var(--min-t);color:var(--fg);border:1px solid var(--min)}
.banner.alert{background:var(--miss-t);color:var(--fg);border:1px solid var(--miss)}
.banner.info{background:var(--surface-2)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;padding:13px 14px;border-radius:16px;border:0;background:var(--surface);font-weight:600;font-size:13.5px;line-height:1.2;min-height:78px}
.choice svg{width:22px;height:22px;flex:none}
.choice.c-done{color:var(--done)} .choice.c-min{color:var(--min)} .choice.c-rest{color:var(--rest)} .choice.c-miss{color:var(--miss)}
.choice span{color:var(--fg)}
.choice[aria-pressed="true"]{box-shadow:inset 0 0 0 2px currentColor}
.choice{transition:background .2s}
.choice.c-done[aria-pressed="true"]{background:var(--done-t)} .choice.c-min[aria-pressed="true"]{background:var(--min-t)}
.choice.c-rest[aria-pressed="true"]{background:var(--rest-t)} .choice.c-miss[aria-pressed="true"]{background:var(--miss-t)}
.choice:disabled{opacity:.5;cursor:not-allowed}
.feedback{font-size:15px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:0;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--font-head);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:500}
.tag{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--done-t);color:var(--done)}
.tag.t1{background:var(--accent-t);color:var(--accent)} .tag.t2{background:var(--rest-t);color:var(--rest)} .tag.t3{background:var(--min-t);color:var(--min)} .tag.t4{background:var(--done-t);color:var(--done)}
.todo{border-left:4px solid var(--accent);padding-left:12px;font-weight:500}
.todo b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
button.cell:hover{border-color:var(--primary)}
.cell .dn{font-size:11px;color:var(--muted);font-weight:700}
.cell .dd{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.cell .g{width:22px;height:22px;display:grid;place-items:center}
.cell .g svg{width:22px;height:22px}
.cell .pl{width:5px;height:5px;border-radius:50%;background:var(--line)}
.cell.planned .pl{background:var(--primary)}
.cell.today{border:2px solid var(--primary)}
.cell.s-done .g{color:var(--done)} .cell.s-min .g{color:var(--min)} .cell.s-rest .g{color:var(--rest)} .cell.s-miss .g{color:var(--miss)}
.cell.s-missed .g{color:var(--miss);opacity:.45}
.cell.s-pending .g::before{content:"";width:18px;height:18px;border-radius:50%;border:2px dashed var(--muted)}
.cell.s-off .g::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line)}
.cell.s-future,.cell.s-pre{opacity:.55}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--primary);color:var(--on-primary);min-height:46px}
.btn.alt{background:var(--surface-2);color:var(--fg)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--fg)}
.btn.danger{background:var(--miss);color:var(--on-status)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px}
.tag.tm{background:var(--miss-t);color:var(--miss)}

.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;line-height:1.25;color:var(--muted);min-width:0}
.badge .c{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:22px;border:2px dashed var(--line);color:var(--muted)}
.badge.on{color:var(--fg);font-weight:700}
.badge.on .c{background:var(--accent);border:0;color:var(--on-status)}
.burst{position:relative;overflow:hidden}
.card.burst{background:transparent;padding:0 3px}
.goalhead{display:flex;gap:14px;align-items:center}.goalhead svg{flex:none}
.goalcard .goal{font-size:15px;font-weight:500;color:var(--muted);line-height:1.4}
.goalcard h2{font-size:19px;margin:3px 0 3px}
.goalcard .goal-sub{border-top:1px solid var(--line);padding-top:10px}
.obveza{border-radius:6px 20px 20px 6px;border-left:4px solid var(--ring)}
.obveza .btn{width:100%}
.rider-ov{display:none}
.celebrate{position:relative;overflow:hidden;align-items:center;text-align:center}
.celebrate .medal{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--on-status);display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:34px}
@media (prefers-reduced-motion:no-preference){
  .rider-ov{display:block;position:absolute;left:0;right:0;top:12%;height:200px;pointer-events:none}
  .rider-ov svg{width:100%;height:100%;overflow:hidden;display:block}
  .rx{animation:rx 2s linear 1 forwards}
  .ry{animation:ry 2s linear 1 forwards;transform-origin:0 -20px}
  .dust circle{opacity:0;transform-box:fill-box;transform-origin:center;animation:dust .55s ease-out 1.34s 1 forwards}
  .dust circle:nth-child(2){animation-delay:1.4s}
  .dust circle:nth-child(3){animation-delay:1.46s}
  .spark circle{opacity:0;animation:spark .7s ease-out 1.0s 1 forwards}
  .spark circle:nth-child(2){animation-delay:1.1s}
  .spark circle:nth-child(3){animation-delay:1.2s}
  @keyframes rx{0%{transform:translateX(-80px)}100%{transform:translateX(430px)}}
  @keyframes ry{0%{transform:translateY(0) rotate(0)}38%{transform:translateY(0) rotate(0);animation-timing-function:ease-out}
    42%{transform:translateY(-6px) rotate(-14deg);animation-timing-function:cubic-bezier(.2,.65,.4,1)}
    54%{transform:translateY(-82px) rotate(-3deg);animation-timing-function:cubic-bezier(.6,0,.8,.4)}
    66%{transform:translateY(-2px) rotate(12deg)}70%{transform:translateY(0) rotate(0)}100%{transform:translateY(0) rotate(0)}}
  .rxs{animation:rx 1.7s linear 1 forwards}
  .rys{animation:rys 1.7s linear 1 forwards;transform-origin:0 -20px}
  @keyframes rys{0%{transform:translateY(0)}35%{transform:translateY(0);animation-timing-function:ease-out}50%{transform:translateY(-34px) rotate(-6deg);animation-timing-function:ease-in}64%{transform:translateY(0) rotate(4deg)}72%{transform:translateY(-8px)}80%{transform:translateY(0)}100%{transform:translateY(0)}}
  .rxl{animation:rx 4s linear 1 forwards}
  .ryl{animation:ryl 4s ease-in-out 1 forwards;transform-origin:0 -20px}
  @keyframes ryl{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3px) rotate(-1.5deg)}50%{transform:translateY(0) rotate(1deg)}75%{transform:translateY(-3px) rotate(-1.5deg)}}
  .sh{transform-box:fill-box;transform-origin:50% 100%;animation:nod 1.6s ease-in-out 2.5 forwards}
  @keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
  .zz text{opacity:0;animation:zzf 1.6s ease-out 2.5 forwards}
  .zz text:nth-child(2){animation-delay:.35s}.zz text:nth-child(3){animation-delay:.7s}
  @keyframes zzf{0%{opacity:0;transform:translateY(6px)}30%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
  .rxc{animation:rxc 2.4s cubic-bezier(.2,.7,.3,1) 1 forwards}
  @keyframes rxc{0%{transform:translateX(-90px)}100%{transform:translateX(150px)}}
  .tail{transform-box:fill-box;transform-origin:85% 100%;animation:tl 1.1s ease-in-out 1.6s 3}
  @keyframes tl{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
  .chd{transform-box:fill-box;transform-origin:50% 100%;animation:chd 2.2s ease-in-out 1.2s 1 forwards}
  @keyframes chd{0%{transform:rotate(0)}40%{transform:rotate(10deg) translateY(2px)}100%{transform:rotate(10deg) translateY(2px)}}
  .meh{opacity:0;animation:meh 1.6s ease-out 2.2s 1 forwards}
  @keyframes meh{0%{opacity:0;transform:translateY(4px)}40%{opacity:1}100%{opacity:.85;transform:translateY(-4px)}}
  @keyframes dust{0%{opacity:.8;transform:scale(.3) translateY(0)}100%{opacity:0;transform:scale(1.8) translateY(-8px)}}
  @keyframes spark{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.6) translateY(-14px)}}
  .celebrate .medal{animation:pop .7s cubic-bezier(.2,1.4,.4,1) 1}
  @keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
}
.person{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.person .top2{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:10px;font-size:18px;font-weight:700}
.seg{display:flex;gap:6px}
.seg .btn{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;text-align:center;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:var(--surface-2);display:grid;place-items:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);position:relative;padding:0}
.cal .d.blank{background:transparent}
.cal .d.s-done{background:var(--done-t);color:var(--done);border-color:var(--done)}
.cal .d.s-min{background:var(--min-t);color:var(--min);border-color:var(--min)}
.cal .d.s-rest{background:var(--rest-t);color:var(--rest);border-color:var(--rest)}
.cal .d.s-miss,.cal .d.s-missed{background:var(--miss-t);color:var(--miss);border-color:var(--miss)}
.cal .d.s-missed{border-style:dashed}
.cal .d.s-pending{background:var(--surface);border:2px dashed var(--muted);color:var(--fg)}
.cal .d.s-off{background:var(--surface-2)}
.cal .d.today{outline:2px solid var(--primary);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid currentColor}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end}
.wk{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wk .tr{width:100%;height:84px;background:var(--surface-2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wk .tr i{display:block;width:100%;background:var(--primary)}
.wk b{font-size:12px;font-variant-numeric:tabular-nums}
.wk span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk.cur .tr{outline:2px solid var(--accent);outline-offset:1px}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lb{font-weight:700;font-size:15px}
.field .hint{font-size:13px;color:var(--muted)}
.idrow{display:flex;flex-direction:column;gap:6px}.idpre{font-weight:700;color:var(--sc,var(--accent));font-size:1.05rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fsec{border:1px solid var(--line);border-left:5px solid var(--sc,var(--primary));border-radius:14px;padding:14px 14px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px;margin:14px 0}
.fsec-h{margin:0;font:800 14px/1.2 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--sc,var(--primary));display:flex;align-items:center;gap:10px}
.fsec-n{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:var(--sc,var(--primary));color:var(--on-primary);font-size:13px;letter-spacing:0}
.mwk{display:flex;flex-direction:column;gap:10px}.mwk-r{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center}.mwk-r .bar{margin:0}.mwk-d{font-size:13px;color:var(--muted)}.mwk-r b{text-align:right}
input[type=text],input[type=date],input[type=number],textarea{width:100%;font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px}
textarea{resize:vertical;min-height:84px}
.three{display:grid;grid-template-columns:1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days .chip{padding:10px 0;text-align:center;border-radius:12px}
.err{color:var(--miss);font-weight:700;font-size:14px}
.law{display:flex;flex-direction:column;gap:4px}

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.sheet-back{position:fixed;inset:0;background:rgba(20,30,25,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);color:var(--fg);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}

<body>

<div class="shell">
  <header class="top">
    <div class="brandrow"><span class="brand">Train &amp; Ride · Accountability Club</span><button type="button" class="themebtn" id="themebtn"></button></div>
    <div class="toprow">
      <div><h1 id="title">Danes</h1><span class="datelab" id="datelab"></span></div>
      <div class="streakbox" id="streakbox" hidden></div>
    </div>
    <span class="pill" id="phase" hidden></span>
  </header>
  <div class="tabs" role="tablist" aria-label="Razdelki" id="tabs"></div>
  <main id="app" class="stack"></main>
</div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* LOGIC START */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const wd=s=>(parse(s).getDay()+6)%7;
const weekStart=s=>addDays(s,-wd(s));
const isGood=s=>s==='done'||s==='min';
const isBad=s=>s==='miss'||s==='missed';
const GROUP_START='2026-10-01'; /* TESTNO: pred zagonom skupine vrni na 2026-12-01 */

function dayState(S,day,today){
  const p=S.profile;
  if(!p||day<p.start) return 'pre';
  const l=S.log[day];
  if(l) return l;
  if(day>today) return 'future';
  if(day===today) return 'pending';
  return p.planned.includes(wd(day))?'missed':'off';
}
function streak(S,today){
  let n=0,d=today;
  while(d>=S.profile.start){
    const s=dayState(S,d,today);
    if(isGood(s)) n++; else if(isBad(s)) break;
    d=addDays(d,-1);
  }
  return n;
}
function longestStreak(S,today){
  let run=0,best=0,d=S.profile.start;
  while(d<=today){
    const s=dayState(S,d,today);
    if(isGood(s)){run++;if(run>best)best=run}else if(isBad(s))run=0;
    d=addDays(d,1);
  }
  return best;
}
function totalDone(S,today){
  let n=0,d=S.profile.start;
  while(d<=today){if(isGood(dayState(S,d,today)))n++;d=addDays(d,1)}
  return n;
}
function lastResult(S,today){
  let d=addDays(today,-1);
  while(d>=S.profile.start){
    const s=dayState(S,d,today);
    if(isGood(s)||isBad(s)) return s;
    d=addDays(d,-1);
  }
  return null;
}
function consecutiveMisses(S,today){
  let n=0,d=addDays(today,-1);
  while(d>=S.profile.start){
    const s=dayState(S,d,today);
    if(isBad(s)) n++; else if(isGood(s)) break;
    d=addDays(d,-1);
  }
  return n;
}
function weekSummary(S,ws,today){
  const days=[];let good=0,bad=0;
  for(let i=0;i<7;i++){
    const day=addDays(ws,i);const state=dayState(S,day,today);
    days.push({day,state,planned:!S.profile.perWeek&&S.profile.planned.includes(i)});
    if(isGood(state))good++;else if(isBad(state))bad++;
  }
  const target=S.profile.perWeek||S.profile.planned.length;
  const pct=target?Math.min(1,good/target):null;
  const den=good+bad;
  return {days,good,bad,target,pct,rate:den?good/den:null};
}
function monthSummary(S,y,m,today){
  const first=y+'-'+pad(m+1)+'-01';
  const dim=new Date(y,m+1,0).getDate();
  let good=0,bad=0;const cells=[];
  for(let i=1;i<=dim;i++){
    const day=y+'-'+pad(m+1)+'-'+pad(i);const state=dayState(S,day,today);
    cells.push({day,n:i,state});
    if(isGood(state))good++;else if(isBad(state))bad++;
  }
  const den=good+bad;
  return {cells,lead:wd(first),good,bad,pct:den?good/den:null};
}

const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const dni=n=>n===1?'dan':n===2?'dneva':'dni';
function fridayStatus(S,ws,today){
  const sm=weekSummary(S,ws,today);
  const left=[];
  for(const d of sm.days){ if(d.day>=today&&d.day>=S.profile.start&&!S.log[d.day]) left.push(d.day); }
  const need=Math.max(0,sm.target-sm.good);
  let state='dosezen';
  if(need>0) state=need<=left.length?'dosegljiv':'tezko';
  return {good:sm.good,target:sm.target,need,left,state,marks:sm.days};
}
function nameMatch(a,b){
  const x=norm(a).split(/\s+/),y=norm(b).split(/\s+/);
  if(!x[0]||x[0]!==y[0]) return false;
  return x.length<2||y.length<2||x[1][0]===y[1][0];
}
function rosterIndex(name,roster){
  const i=roster.findIndex(r=>norm(r)===norm(name));
  return i>=0?i:roster.findIndex(r=>nameMatch(name,r));
}
function parseReports(text,today){
  const out=[];
  const re=/(Petkov status|Check-in),\s*teden\s+(\d{1,2})\.\s*(?:(\d{1,2})\.\s*)?[–-]\s*(\d{1,2})\.\s*(\d{1,2})\./g;
  const hits=[];let m;
  while((m=re.exec(text))) hits.push({i:m.index,end:re.lastIndex,m});
  const t=parse(today);
  hits.forEach((k,idx)=>{
    const lineStart=text.lastIndexOf('\n',k.i-1)+1;
    let head=text.slice(lineStart,k.i);
    head=head.replace(/^\s*\[[^\]]*\]\s*/,'').replace(/^\s*\d{1,2}[./]\d{1,2}[./]\d{2,4},?\s*\d{1,2}[:.]\d{2}\s*[-–]\s*/,'');
    let sender='';const pm=head.match(/^([^:·]{1,40}):\s*/);
    if(pm){sender=pm[1].trim();head=head.slice(pm[0].length)}
    const dot=head.indexOf('·');
    const name=((dot>=0?head.slice(0,dot):head).trim())||sender;
    const body=text.slice(k.end,idx+1<hits.length?hits[idx+1].i:text.length);
    const dm=body.match(/Izvedeno:\s*(\d+)\s*od\s*(\d+)/);
    if(!dm) return;
    const sm=k.m[3]?+k.m[3]:+k.m[5];
    let y=t.getFullYear();const cm=t.getMonth()+1;
    if(sm-cm>6) y--; else if(cm-sm>6) y++;
    const ws=weekStart(y+'-'+pad(sm)+'-'+pad(+k.m[2]));
    const st=body.match(/Status:\s*([^\n]*)/);
    let status=null;
    if(st){const n=norm(st[1]);status=n.includes('dosegljiv')?'dosegljiv':n.includes('dosezen')?'dosezen':n.includes('tezko')?'tezko':null}
    const nd=body.match(/Do cilja še:\s*(\d+)/);
    out.push({name,kind:k.m[1]==='Check-in'?'checkin':'friday',ws,done:+dm[1],target:+dm[2],status,need:nd?+nd[1]:Math.max(0,+dm[2]-+dm[1])});
  });
  return out;
}
function coachRows(roster,reports,ws){
  return roster.map(name=>{
    const rs=reports.filter(r=>r.ws===ws&&nameMatch(r.name,name));
    const r=rs.find(x=>x.kind==='checkin')||rs.find(x=>x.kind==='friday')||null;
    let state='brez';
    if(r){
      if(r.done>=r.target) state='dosezen';
      else if(r.kind==='friday') state=r.status==='tezko'?'tezko':'dosegljiv';
      else state='nedosezen';
    }
    return {name,report:r,state};
  });
}
function coachMsg(row){
  const f=row.name.split(/\s+/)[0];
  const need=row.report?Math.max(0,row.report.target-row.report.done):0;
  if(row.state==='brez') return 'Hej '+f+'! 💚 Tega tedna še nisem videla tvojega statusa. Kako ti gre? Še je čas, tudi minimalna različica šteje. Če je teden težak, mi kar napiši in poiščeva najmanjši korak.';

function noteInsight(G,today){
  const wins=[],obs=[];
  Object.keys(G.notes||{}).sort().forEach(d=>{
    if(d>today) return;
    const t=norm(G.notes[d]);if(!t) return;
    const st=dayState(G,d,today);
    if(st==='done') wins.push({d,t,raw:G.notes[d]});
    else if(st==='min'||st==='miss'||st==='missed'||st==='rest') obs.push({d,t,raw:G.notes[d]});
  });
  let win=null;
  if(wins.length){
    let best=null;
    THEMES.forEach(([re,label])=>{const n=wins.filter(w=>re.test(w.t)).length;if(n>=2&&(!best||n>best.count))best={label,count:n,total:wins.length}});
    win=best||{echo:wins[wins.length-1].raw};
  }
  let ob=null;
  for(let i=obs.length-1;i>=0&&!ob;i--){OBST.forEach(([re,label,tip])=>{if(!ob&&re.test(obs[i].t))ob={label,tip}})}
  return {win,obstacle:ob,wins:wins.map(w=>w.raw)};
}

function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const k in (props||{})){
    const v=props[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat()) if(c!=null&&c!==false) e.append(c.nodeType?c:document.createTextNode(c));
  return e;
}

function mergeReports(list){
  let n=0,skipped=0;
  list.forEach(r=>{
    if(!r.name){skipped++;return}
    let i=rosterIndex(r.name,C.roster);
    if(i<0){C.roster.push(r.name);i=C.roster.length-1}
    r.name=C.roster[i];
    C.reports=C.reports.filter(x=>!(x.ws===r.ws&&x.kind===r.kind&&nameMatch(x.name,r.name)));
    C.reports.push(r);n++;
  });
  C.reports=C.reports.slice(-600);saveC();
  return {n,skipped};
}

function setNote(day,text){
  if(text.trim()) S.notes[day]=text.slice(0,140); else delete S.notes[day];
  save();
}

  const nt=h('textarea',{rows:'2',maxlength:'140','aria-label':'Opomba (ni obvezno)'});
  nt.value=S.notes[day]||'';

    h('div',{class:'row'},h('h2',{text:off===0?'Ta teden':off===-1?'Prejšnji teden':'Teden '+fmtRange(ws)}),
      h('div',{class:'row'},h('button',{class:'iconbtn',type:'button','aria-label':'Prejšnji teden',onclick:()=>{ui.cOff=off-1;render()}},'‹'),
        h('button',{class:'iconbtn',type:'button','aria-label':'Naslednji teden',disabled:off>=0,onclick:()=>{ui.cOff=off+1;render()}},'›'))),
    h('p',{class:'small muted',text:fmtRange(ws)}),
    h('p',{text:'Dosegle: '+cnt.dosezen+' · Še dosegljivo: '+cnt.dosegljiv+' · Težko: '+cnt.tezko+' · Brez poročila: '+cnt.brez+(cnt.nedosezen?' · Ni dosegla: '+cnt.nedosezen:'')}),
    list));

  const pt=h('textarea',{id:'coach-paste',rows:'6','aria-label':'Prilepi sporočila',placeholder:'Prilepi sem sporočila iz WhatsAppa …'});
  pt.value=ui.cPaste||'';pt.addEventListener('input',()=>{ui.cPaste=pt.value});
  const pmsg=h('p',{class:'small muted',role:'status'});
  out.push(h('section',{class:'card'},h('h2',{text:'Prilepi sporočila'}),
    h('p',{class:'small muted',text:'Označi in kopiraj sporočila z naslovom Check-in ali Petkov status iz skupine ali zasebnih pogovorov in jih prilepi sem. Poročilo se uvrsti v teden, ki piše v naslovu.'}),
    pt,pmsg,
    h('button',{class:'btn',type:'button',onclick:()=>{
      const found=parseReports(pt.value,today);
      if(!found.length){pmsg.textContent='Ni najdenih sporočil. Prilepi sporočila, ki jih ustvari aplikacija (Check-in ali Petkov status).';return}
      const r=mergeReports(found);ui.cPaste='';render();
      toast('Prebrano: '+r.n+(r.skipped?' · brez imena: '+r.skipped:''));
    }},'Preberi sporočila')));

  const fd=C.fund;const fc=fundCalc(C.reports,today);const ftot=fc.weeks*fd.eur;
  const fk=[h('h2',{text:'Skupni sklad (neobvezno)'}),
    h('p',{class:'small muted',text:'Vklopi šele, ko se z idejo strinjajo vse udeleženke. Če katera ni prepričana, ga pusti izklopljenega.'}),
    h('button',{class:'btn '+(fd.on?'ghost':'alt')+' sm',type:'button',onclick:()=>{fd.on=!fd.on;saveC();render()}},fd.on?'Izklopi sklad':'Vklopi sklad')];
  if(fd.on){
    const ei=h('input',{type:'number',id:'fund-eur',min:'1',max:'50',step:'1','aria-label':'Znesek na nedosežen teden v evrih'});ei.value=String(fd.eur);
    ei.addEventListener('change',()=>{fd.eur=Math.max(1,Math.min(50,Math.round(+ei.value||2)));saveC();render()});
    const ci=h('input',{type:'text',id:'fund-ch','aria-label':'Dobrodelna organizacija',maxlength:'80',placeholder:'Dobrodelna organizacija'});ci.value=fd.charity;
    ci.addEventListener('change',()=>{fd.charity=ci.value.trim();saveC()});
    const per=Object.keys(fc.per).map(n=>h('p',{class:'small',text:n+': '+fc.per[n]+' × '+fd.eur+' € = '+fc.per[n]*fd.eur+' €'}));
    fk.push(h('div',{class:'field'},h('label',{for:'fund-eur',text:'Znesek na nedosežen teden (€)'}),ei),
      h('div',{class:'field'},h('label',{for:'fund-ch',text:'Namen'}),ci),
      h('p',{text:'Nedoseženih tednov: '+fc.weeks+' · v skladu: '+ftot+' €'}),
      per.length?h('div',{class:'stack'},per):h('p',{class:'small muted',text:'Zaenkrat ni nedoseženih tednov.'}),
      h('p',{class:'small muted',text:'Šteje samo check-in za zaključen teden. Imena so samo zate, v skupino pošlji le skupni znesek.'}),
      h('button',{class:'btn alt sm',type:'button',onclick:async()=>{
        const m=fc.weeks?'Sklad za dobrodelni namen'+(C.fund.charity?' ('+C.fund.charity+')':'')+': do zdaj je '+fc.weeks+' nedoseženih tednov po '+C.fund.eur+' €, skupaj '+fc.weeks*C.fund.eur+' €. Vsaka donira svoj znesek neposredno in mi pošlje potrdilo. Hvala, da štejemo skupaj. 💚':'Sklad za dobrodelni namen je zaenkrat prazen: ni nedoseženih tednov. Bravo, ekipa! 💚';
        try{await navigator.clipboard.writeText(m);toast('Sporočilo kopirano')}catch(e){toast('Kopiranje ni uspelo')}
      }},'Kopiraj sporočilo za skupino'));
  }
  out.push(h('section',{class:'card'},fk));

  const inp=h('input',{type:'text',id:'coach-add','aria-label':'Ime udeleženke',placeholder:'Ime in začetnica priimka',maxlength:'60',autocomplete:'off'});
  const addForm=h('form',{novalidate:true,onsubmit:e=>{
    e.preventDefault();const v=inp.value.trim();if(!v)return;
    if(rosterIndex(v,C.roster)<0){C.roster.push(v);saveC()}
    render();
  }},inp,h('button',{class:'btn alt',type:'submit'},'Dodaj'));
  const chips=h('div',{class:'chips'},C.roster.map((n,i)=>h('button',{class:'chip',type:'button','aria-label':'Odstrani '+n,onclick:()=>{C.roster.splice(i,1);saveC();render()}},n+' ×')));
  const clr=h('button',{class:'btn ghost sm',type:'button',onclick:()=>{
    if(clr.dataset.armed!=='1'){clr.dataset.armed='1';clr.textContent='Res izbrišem vsa poročila? Tapni še enkrat.';clr.className='btn danger sm';return}
    C.reports=[];saveC();render();toast('Poročila so izbrisana');
  }},'Izbriši vsa poročila');
  out.push(h('section',{class:'card'},h('h2',{text:'Udeleženke'}),
    h('p',{class:'small muted',text:'Seznam je shranjen samo na tej napravi. Tapni ime, če ga želiš odstraniti.'}),
    addForm,C.roster.length?chips:null,clr));
  return out;
}

/* ---------- Znanje ---------- */
function viewKnowledge(){
  const out=[];
  const step=(n,lead,txt)=>h('div',{class:'nstep'},h('span',{class:'nn',text:String(n)}),h('div',{},h('b',{text:lead}),txt?h('span',{text:' '+txt}):null));
  out.push(h('section',{class:'card'},h('h2',{text:'Štirje zakoni navade'}),h('p',{class:'small muted',text:'Po načelih knjige Atomic Habits (James Clear). Če navada ne uspeva, pomisli, kateri zakon manjka.'}),
    h('div',{class:'laws'},LAWS.map((l,i)=>h('div',{class:'lawt t'+(i+1)},h('span',{class:'tag t'+(i+1),text:(i+1)+'. zakon'}),h('h3',{text:l.n}),h('p',{text:l.x}),h('div',{class:'ex'},h('b',{text:'Primer '}),l.p.replace(/^Primer:\s*/,'')))))));
  out.push(h('section',{class:'card'},h('h2',{text:'Pravila skupine'}),
    h('div',{class:'nsteps'},
      step(1,'En cilj.','Prvi mesec velja en cilj in ena minimalna različica. Cilj je lahko karkoli.'),
      step(2,'Dodatni cilji.','Ko ti prvi cilj uspeva vsaj 70 % načrtovanih dni, se po 28 dneh odprejo še do 2 dodatna cilja.'),
      step(3,'Pokaži se.','Prva dva tedna je cilj samo pokazati se, ne doseči rezultata.'),
      step(4,'Enkrat zgrešiš, ni panike.','Dvakrat zapored ne: takrat narediš vsaj minimalno različico ali se oglasiš v WhatsApp skupini.'),
      step(5,'Piši že prej.','Če čutiš, da zmanjkuje motivacije in zagona, to napiši, še preden zgrešiš. Skupina ali Teja pomaga poiskati najmanjši možni korak.'),
      step(6,'Počitek.','Bolezen, potovanje ali utrujenost označiš kot počitek.'),
      step(7,'Podpiramo, ne sodimo.',''))));
  out.push(h('section',{class:'card'},h('h2',{text:'Kako uporabljam aplikacijo'}),
    h('div',{class:'nsteps'},
      step(1,'Zapiši cilj.','V razdelku Moj cilj vpiši cilj, minimalno različico in dneve.'),
      step(2,'Označi dan.','Označi dneve, ko imaš cilj v načrtu ali ko ga narediš. Pri »dan izberem sproti« vneseš, ko ga izvedeš. Traja deset sekund.'),
      step(3,'Ponedeljek.','V razdelku Napredek odgovori na razmislek, kopiraj check-in in ga pošlji v skupino.'),
      step(4,'Varnostna koda.','Shrani jo, da ne izgubiš podatkov ob menjavi telefona.'))));
  out.push(h('section',{class:'card'},h('h3',{text:'Zasebnost'}),h('p',{class:'small',text:'Podatki ostanejo samo v tvojem brskalniku. Teja in skupina vidita samo to, kar sama pošlješ v check-inu.'})));
  const tkids=[h('h3',{text:'Za trenerko'}),h('p',{class:'small muted',text:'Pogled za Tejo: pregled poročil skupine. Deluje samo na tej napravi in je prazen, dokler ne prilepiš sporočil.'}),
    h('button',{class:'btn alt sm',type:'button',onclick:()=>{C.on=!C.on;saveC();if(!C.on&&ui.tab==='trener')ui.tab='danes';render()}},C.on?'Izklopi pogled za trenerko':'Vklopi pogled za trenerko')];
  if(C.on){
    const di=h('input',{type:'date',value:todayStr(),'aria-label':'Testni dan'});
    const nextMon=()=>{const t=parse(ymd(new Date()));const d=(8-t.getDay())%7||7;t.setDate(t.getDate()+d);return ymd(t)};
    tkids.push(h('div',{class:'testbox'},h('b',{text:'Preizkusi drug dan'}),
      h('p',{class:'small muted',text:'Aplikacija se pretvarja, da je izbrani dan, in pokaže ponedeljkov check-in ali razmislek. Vnosi v testnem načinu se ob vrnitvi zbrišejo, tvoji podatki ostanejo takšni kot prej.'}),
      h('div',{class:'row'},di,h('button',{class:'btn sm',type:'button',onclick:()=>{if(di.value)startTest(di.value)}},'Preizkusi')),
      h('button',{class:'btn alt sm',type:'button',onclick:()=>startTest(nextMon())},'Naslednji ponedeljek')));
  }
  out.push(h('section',{class:'card'},tkids));
  return fpStyle(out);
}

/* ---------- list za vnos preteklega dne ---------- */
function renderSheet(){
  const box=document.getElementById('sheet');box.replaceChildren();
  const day=ui.sheetDay;if(!day||!S.profile) return;
  const today=todayStr();const cur=S.log[day]||null;const d=parse(day);
  const close=()=>{ui.sheetDay=null;renderSheet()};
  const back=h('div',{class:'sheet-back',onclick:e=>{if(e.target===back)close()}});
  const choices=h('div',{class:'choices'});
  [['done','Cilj dosežen'],['min','Minimalna različica'],['rest','Počitek ali pavza'],['miss','Ni izvedeno']].forEach(([k,label])=>{
    choices.append(h('button',{class:'choice c-'+k,type:'button','aria-pressed':cur===k?'true':'false',onclick:()=>setDay(day,k)},h('i',{html:ICON[k],style:'display:contents'}),h('span',{text:label})));
  });
  const nf=noteField(day);
  const sheet=h('div',{class:'sheet',role:'dialog','aria-modal':'true','aria-label':'Vnos za dan'},
    h('h2',{text:DAYS_LONG[wd(day)].charAt(0).toUpperCase()+DAYS_LONG[wd(day)].slice(1)+', '+d.getDate()+'. '+(d.getMonth()+1)+'.'}),
    choices,nf,
    h('div',{class:'row'},cur?h('button',{class:'btn ghost sm',type:'button',onclick:()=>setDay(day,null)},'Počisti vnos'):h('span'),h('button',{class:'btn alt sm',type:'button',id:'sheet-close',onclick:close},'Zapri')));
  back.append(sheet);box.append(back);

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheetDay){ui.sheetDay=null;renderSheet()}});

/* ---------- glavni izris ---------- */
function render(){
  const today=todayStr();
  useGoal();
  renderHead(today);renderTabs();
  const app=document.getElementById('app');app.replaceChildren();
  const views={danes:viewToday,napredek:viewProgress,cilj:viewGoal,znanje:viewKnowledge,trener:viewCoach};

  if(ui._lt!==ui.tab){ui._lt=ui.tab;window.scrollTo(0,0)}
}
/* ---------- dostop s kodo skupine ---------- */
/* Koda se zamenja tako: izracunaj SHA-256 nove kode (velike crke, brez presledkov in vezajev) in ga vpisi v ACCESS_HASH. */
const ACCESS_HASH='72d2778e8277b18c2a2d334ccdd114d240f61ed55979a533eecc39aa6e54babf';
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function normCode(v){return String(v||'').toUpperCase().replace(/[\s\-_]/g,'')}
function hasAccess(){try{return localStorage.getItem('tr-access')===ACCESS_HASH}catch(e){return false}}
function showGate(){
  const shell=document.querySelector('.shell');if(shell)shell.style.display='none';
  const msg=h('p',{class:'small',style:'color:var(--miss);min-height:1.4em;margin:8px 0 0',role:'alert'});
  const inp=h('input',{type:'text',autocomplete:'off',autocapitalize:'characters',spellcheck:'false','aria-label':'Koda skupine',placeholder:'Koda skupine',style:'text-align:center;font-size:1.1rem;letter-spacing:.08em'});
  const go=async()=>{
    msg.textContent='';
    let ok=false;
    try{ok=(await sha(normCode(inp.value)))===ACCESS_HASH}catch(e){msg.textContent='Brskalnik ne podpira preverjanja. Poskusi z drugim brskalnikom.';return}
    if(!ok){msg.textContent='Koda ni pravilna. Preveri sporočilo od Teje.';return}
    try{localStorage.setItem('tr-access',ACCESS_HASH)}catch(e){}
    gate.remove();if(shell)shell.style.display='';render();
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  const gate=h('div',{style:'min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)'},
    h('div',{class:'card',style:'max-width:380px;width:100%;text-align:center'},
      h('span',{class:'label',text:'Train & Ride'}),h('h1',{text:'Accountability Club',style:'margin:6px 0 10px'}),
      h('p',{text:'Aplikacija je namenjena članom skupine. Vpiši kodo, ki jo je poslala Teja.'}),
      inp,msg,h('button',{class:'btn',type:'button',style:'margin-top:12px;width:100%',onclick:go},'Vstopi')));
  document.body.append(gate);inp.focus();
}
setupTheme();
try{history.scrollRestoration='manual'}catch(e){}
const toTop=()=>{window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0};
window.addEventListener('pageshow',toTop);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)toTop()});
if(hasAccess())render();else showGate();
toTop();setTimeout(toTop,80);setTimeout(toTop,400);
})();
