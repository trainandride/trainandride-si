<style>
/* Koncept: ena kolona, zavihki zgoraj, velike tipke za dnevni vnos. Gozdno zelena + korala iz podobe skupine. */
:root{
  --bg:#eef3ef; --surface:#ffffff; --surface-2:#e3ebe5; --fg:#14291f; --muted:#506358; --line:#cddbd1;
  --primary:#1d6849; --on-primary:#ffffff; --accent:#e8603a; --accent-t:#fde7df;
  --done:#2a8a5e; --done-t:#d7efe2; --min:#b87d0e; --min-t:#f8e9c6; --rest:#5f7898; --rest-t:#dfe7f1; --miss:#cf4a3a; --miss-t:#f8dcd7;
  --on-status:#ffffff;
  --font-head:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'DM Sans','Segoe UI',system-ui,sans-serif;
}
@media all{
  :root,:root[data-theme="light"]{
    --bg:#0e2017; --surface:#163024; --surface-2:#1e3d2e; --fg:#e8f1ea; --muted:#9bb4a4; --line:#2b4a3a;
    --primary:#46b886; --on-primary:#062014; --accent:#ff8a66; --accent-t:#3a2a24;
    --done:#4cc48a; --done-t:#1c4a36; --min:#e8b04a; --min-t:#4a3b17; --rest:#8fa8c8; --rest-t:#26384d; --miss:#ef7b6c; --miss-t:#4d2723;
    --on-status:#08150e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e2017; --surface:#163024; --surface-2:#1e3d2e; --fg:#e8f1ea; --muted:#9bb4a4; --line:#2b4a3a;
  --primary:#46b886; --on-primary:#062014; --accent:#ff8a66; --accent-t:#3a2a24;
  --done:#4cc48a; --done-t:#1c4a36; --min:#e8b04a; --min-t:#4a3b17; --rest:#8fa8c8; --rest-t:#26384d; --miss:#ef7b6c; --miss-t:#4d2723;
  --on-status:#08150e; color-scheme:dark;
}

p{margin:0}

  @keyframes rx{0%{transform:translateX(-80px)}100%{transform:translateX(430px)}}
  @keyframes ry{0%{transform:translateY(0) rotate(0)}38%{transform:translateY(0) rotate(0);animation-timing-function:ease-out}

    54%{transform:translateY(-82px) rotate(-3deg);animation-timing-function:cubic-bezier(.6,0,.8,.4)}
    66%{transform:translateY(-2px) rotate(12deg)}70%{transform:translateY(0) rotate(0)}100%{transform:translateY(0) rotate(0)}}
  @keyframes dust{0%{opacity:.8;transform:scale(.3) translateY(0)}100%{opacity:0;transform:scale(1.8) translateY(-8px)}}
  @keyframes spark{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.6) translateY(-14px)}}

<body>

<div class="shell">
  <header class="top">
    <span class="brand">Train &amp; Ride · Accountability Club</span>
    <h1 id="title">Zimske navade</h1>
    <span class="pill" id="phase" hidden></span>
  </header>
  <div class="tabs" role="tablist" aria-label="Razdelki" id="tabs"></div>
  <main id="app" class="stack"></main>
</div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* LOGIC START */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const wd=s=>(parse(s).getDay()+6)%7;
const weekStart=s=>addDays(s,-wd(s));
const isGood=s=>s==='done'||s==='min';
const isBad=s=>s==='miss'||s==='missed';
const GROUP_START='2026-10-01'; /* TESTNO: pred zagonom skupine vrni na 2026-12-01 */

function dayState(S,day,today){
  const p=S.profile;
  if(!p||day<p.start) return 'pre';
  const l=S.log[day];
  if(l) return l;
  if(day>today) return 'future';
  if(day===today) return 'pending';
  return p.planned.includes(wd(day))?'missed':'off';
}
function streak(S,today){
  let n=0,d=today;
  while(d>=S.profile.start){
    const s=dayState(S,d,today);
    if(isGood(s)) n++; else if(isBad(s)) break;
    d=addDays(d,-1);
  }
  return n;
}
function longestStreak(S,today){
  let run=0,best=0,d=S.profile.start;
  while(d<=today){
    const s=dayState(S,d,today);
    if(isGood(s)){run++;if(run>best)best=run}else if(isBad(s))run=0;
    d=addDays(d,1);
  }
  return best;
}
function totalDone(S,today){
  let n=0,d=S.profile.start;
  while(d<=today){if(isGood(dayState(S,d,today)))n++;d=addDays(d,1)}
  return n;
}
function lastResult(S,today){
  let d=addDays(today,-1);
  while(d>=S.profile.start){
    const s=dayState(S,d,today);
    if(isGood(s)||isBad(s)) return s;
    d=addDays(d,-1);
  }
  return null;
}
function consecutiveMisses(S,today){
  let n=0,d=addDays(today,-1);
  while(d>=S.profile.start){
    const s=dayState(S,d,today);
    if(isBad(s)) n++; else if(isGood(s)) break;
    d=addDays(d,-1);
  }
  return n;
}
function weekSummary(S,ws,today){
  const days=[];let good=0,bad=0;
  for(let i=0;i<7;i++){
    const day=addDays(ws,i);const state=dayState(S,day,today);
    days.push({day,state,planned:!S.profile.perWeek&&S.profile.planned.includes(i)});
    if(isGood(state))good++;else if(isBad(state))bad++;
  }
  const target=S.profile.perWeek||S.profile.planned.length;
  const pct=target?Math.min(1,good/target):null;
  const den=good+bad;
  return {days,good,bad,target,pct,rate:den?good/den:null};
}
function monthSummary(S,y,m,today){
  const first=y+'-'+pad(m+1)+'-01';
  const dim=new Date(y,m+1,0).getDate();
  let good=0,bad=0;const cells=[];
  for(let i=1;i<=dim;i++){

  const need=Math.max(0,sm.target-sm.good);

function parseReports(text,today){

  const hits=[];let m;
  while((m=re.exec(text))) hits.push({i:m.index,end:re.lastIndex,m});
  const t=parse(today);
  hits.forEach((k,idx)=>{
    const lineStart=text.lastIndexOf('\n',k.i-1)+1;
    let head=text.slice(lineStart,k.i);
    head=head.replace(/^\s*\[[^\]]*\]\s*/,'').replace(/^\s*\d{1,2}[./]\d{1,2}[./]\d{2,4},?\s*\d{1,2}[:.]\d{2}\s*[-–]\s*/,'');
    let sender='';const pm=head.match(/^([^:·]{1,40}):\s*/);
    if(pm){sender=pm[1].trim();head=head.slice(pm[0].length)}
    const dot=head.indexOf('·');
    const name=((dot>=0?head.slice(0,dot):head).trim())||sender;
    const body=text.slice(k.end,idx+1<hits.length?hits[idx+1].i:text.length);
    const dm=body.match(/Izvedeno:\s*(\d+)\s*od\s*(\d+)/);
    if(!dm) return;
    const sm=k.m[3]?+k.m[3]:+k.m[5];
    let y=t.getFullYear();const cm=t.getMonth()+1;
    if(sm-cm>6) y--; else if(cm-sm>6) y++;
    const ws=weekStart(y+'-'+pad(sm)+'-'+pad(+k.m[2]));
    const st=body.match(/Status:\s*([^\n]*)/);
    let status=null;
    if(st){const n=norm(st[1]);status=n.includes('dosegljiv')?'dosegljiv':n.includes('dosezen')?'dosezen':n.includes('tezko')?'tezko':null}
    const nd=body.match(/Do cilja še:\s*(\d+)/);
    out.push({name,kind:k.m[1]==='Check-in'?'checkin':'friday',ws,done:+dm[1],target:+dm[2],status,need:nd?+nd[1]:Math.max(0,+dm[2]-+dm[1])});
  });
  return out;
}

function noteInsight(G,today){
  const wins=[],obs=[];
  Object.keys(G.notes||{}).sort().forEach(d=>{
    if(d>today) return;
    const t=norm(G.notes[d]);if(!t) return;
    const st=dayState(G,d,today);
    if(st==='done') wins.push({d,t,raw:G.notes[d]});
    else if(st==='min'||st==='miss'||st==='missed'||st==='rest') obs.push({d,t,raw:G.notes[d]});
  });
  let win=null;
  if(wins.length){
    let best=null;
    THEMES.forEach(([re,label])=>{const n=wins.filter(w=>re.test(w.t)).length;if(n>=2&&(!best||n>best.count))best={label,count:n,total:wins.length}});
    win=best||{echo:wins[wins.length-1].raw};
  }
  let ob=null;
  for(let i=obs.length-1;i>=0&&!ob;i--){OBST.forEach(([re,label,tip])=>{if(!ob&&re.test(obs[i].t))ob={label,tip}})}
  return {win,obstacle:ob,wins:wins.map(w=>w.raw)};
}

    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;

function setNote(day,text){
  if(text.trim()) S.notes[day]=text.slice(0,140); else delete S.notes[day];
  save();
}
function noteField(day){
  const nt=h('textarea',{rows:'2',maxlength:'140','aria-label':'Opomba (ni obvezno)'});
  nt.value=S.notes[day]||'';
  nt.addEventListener('input',()=>setNote(day,nt.value));
  return h('div',{class:'field'},h('span',{class:'lb',text:'Opomba (ni obvezno)'}),h('span',{class:'hint',text:'Kaj ti je pomagalo? Kako se počutiš po izvedbi?'}),nt);

    h('p',{text:'Dosegle: '+cnt.dosezen+' · Še dosegljivo: '+cnt.dosegljiv+' · Težko: '+cnt.tezko+' · Brez poročila: '+cnt.brez+(cnt.nedosezen?' · Ni dosegla: '+cnt.nedosezen:'')}),
    list));

  const pt=h('textarea',{id:'coach-paste',rows:'6','aria-label':'Prilepi sporočila',placeholder:'Prilepi sem sporočila iz WhatsAppa …'});
  pt.value=ui.cPaste||'';pt.addEventListener('input',()=>{ui.cPaste=pt.value});
  const pmsg=h('p',{class:'small muted',role:'status'});
  out.push(h('section',{class:'card'},h('h2',{text:'Prilepi sporočila'}),
    h('p',{class:'small muted',text:'Označi in kopiraj sporočila z naslovom Check-in ali Petkov status iz skupine ali zasebnih pogovorov in jih prilepi sem. Poročilo se uvrsti v teden, ki piše v naslovu.'}),
    pt,pmsg,
    h('button',{class:'btn',type:'button',onclick:()=>{
      const found=parseReports(pt.value,today);
      if(!found.length){pmsg.textContent='Ni najdenih sporočil. Prilepi sporočila, ki jih ustvari aplikacija (Check-in ali Petkov status).';return}
      const r=mergeReports(found);ui.cPaste='';render();
      toast('Prebrano: '+r.n+(r.skipped?' · brez imena: '+r.skipped:''));
    }},'Preberi sporočila')));

  const fd=C.fund;const fc=fundCalc(C.reports,today);const ftot=fc.weeks*fd.eur;
  const fk=[h('h2',{text:'Skupni sklad (neobvezno)'}),
    h('p',{class:'small muted',text:'Vklopi šele, ko se z idejo strinjajo vse udeleženke. Če katera ni prepričana, ga pusti izklopljenega.'}),
    h('button',{class:'btn '+(fd.on?'ghost':'alt')+' sm',type:'button',onclick:()=>{fd.on=!fd.on;saveC();render()}},fd.on?'Izklopi sklad':'Vklopi sklad')];
  if(fd.on){
    const ei=h('input',{type:'number',id:'fund-eur',min:'1',max:'50',step:'1','aria-label':'Znesek na nedosežen teden v evrih'});ei.value=String(fd.eur);
    ei.addEventListener('change',()=>{fd.eur=Math.max(1,Math.min(50,Math.round(+ei.value||2)));saveC();render()});
    const ci=h('input',{type:'text',id:'fund-ch','aria-label':'Dobrodelna organizacija',maxlength:'80',placeholder:'Dobrodelna organizacija'});ci.value=fd.charity;
    ci.addEventListener('change',()=>{fd.charity=ci.value.trim();saveC()});
    const per=Object.keys(fc.per).map(n=>h('p',{class:'small',text:n+': '+fc.per[n]+' × '+fd.eur+' € = '+fc.per[n]*fd.eur+' €'}));
    fk.push(h('div',{class:'field'},h('label',{for:'fund-eur',text:'Znesek na nedosežen teden (€)'}),ei),
      h('div',{class:'field'},h('label',{for:'fund-ch',text:'Namen'}),ci),
      h('p',{text:'Nedoseženih tednov: '+fc.weeks+' · v skladu: '+ftot+' €'}),
      per.length?h('div',{class:'stack'},per):h('p',{class:'small muted',text:'Zaenkrat ni nedoseženih tednov.'}),
      h('p',{class:'small muted',text:'Šteje samo check-in za zaključen teden. Imena so samo zate, v skupino pošlji le skupni znesek.'}),
      h('button',{class:'btn alt sm',type:'button',onclick:async()=>{
        const m=fc.weeks?'Sklad za dobrodelni namen'+(C.fund.charity?' ('+C.fund.charity+')':'')+': do zdaj je '+fc.weeks+' nedoseženih tednov po '+C.fund.eur+' €, skupaj '+fc.weeks*C.fund.eur+' €. Vsaka donira svoj znesek neposredno in mi pošlje potrdilo. Hvala, da štejemo skupaj. 💚':'Sklad za dobrodelni namen je zaenkrat prazen: ni nedoseženih tednov. Bravo, ekipa! 💚';
        try{await navigator.clipboard.writeText(m);toast('Sporočilo kopirano')}catch(e){toast('Kopiranje ni uspelo')}
      }},'Kopiraj sporočilo za skupino'));
  }
  out.push(h('section',{class:'card'},fk));

  const inp=h('input',{type:'text',id:'coach-add','aria-label':'Ime udeleženke',placeholder:'Ime in začetnica priimka',maxlength:'60',autocomplete:'off'});
  const addForm=h('form',{novalidate:true,onsubmit:e=>{
    e.preventDefault();const v=inp.value.trim();if(!v)return;
    if(rosterIndex(v,C.roster)<0){C.roster.push(v);saveC()}
    render();
  }},inp,h('button',{class:'btn alt',type:'submit'},'Dodaj'));
  const chips=h('div',{class:'chips'},C.roster.map((n,i)=>h('button',{class:'chip',type:'button','aria-label':'Odstrani '+n,onclick:()=>{C.roster.splice(i,1);saveC();render()}},n+' ×')));
  const clr=h('button',{class:'btn ghost sm',type:'button',onclick:()=>{
    if(clr.dataset.armed!=='1'){clr.dataset.armed='1';clr.textContent='Res izbrišem vsa poročila? Tapni še enkrat.';clr.className='btn danger sm';return}
    C.reports=[];saveC();render();toast('Poročila so izbrisana');
  }},'Izbriši vsa poročila');
  out.push(h('section',{class:'card'},h('h2',{text:'Udeleženke'}),
    h('p',{class:'small muted',text:'Seznam je shranjen samo na tej napravi. Tapni ime, če ga želiš odstraniti.'}),
    addForm,C.roster.length?chips:null,clr));
  return out;
}

/* ---------- Znanje ---------- */
function viewKnowledge(){
  const out=[];
  out.push(h('section',{class:'card'},h('h2',{text:'Štirje zakoni navade'}),h('p',{class:'small muted',text:'Povzeto po načelih knjige Atomic Habits (James Clear), prilagojeno za zimsko skupino.'}),
    LAWS.map((l,i)=>h('div',{class:'law'},h('span',{class:'tag t'+(i+1),text:(i+1)+'. zakon'}),h('h3',{text:l.n}),h('p',{text:l.x}),h('p',{class:'small muted',text:'Primer: '+l.p})))));
  out.push(h('section',{class:'card'},h('h2',{text:'Pravila skupine'}),
    h('ol',{class:'steps'},
      h('li',{text:'Prvi mesec en cilj in ena minimalna različica. Cilj je lahko karkoli.'}),
      h('li',{text:'Ko ti prvi cilj uspeva vsaj 70 % načrtovanih dni, se po 28 dneh odprejo še do 2 dodatna cilja.'}),
      h('li',{text:'Prva dva tedna je cilj samo pokazati se, ne doseči rezultata.'}),
      h('li',{text:'Enkrat zgrešiš, ni panike. Dvakrat zapored ne: takrat se zavežemo, da naslednjič uspe.'}),
      h('li',{text:'Obveza: če začutiš, da zmanjkuje motivacije in zagona, to napiši v WhatsApp skupino, še preden zgrešiš. Skupina ali Teja ti pomaga poiskati najmanjši možni korak.'}),
      h('li',{text:'Bolezen, potovanje ali utrujenost označiš kot počitek.'}),
      h('li',{text:'Podpiramo, ne sodimo.'}))));
  out.push(h('section',{class:'card'},h('h2',{text:'Kako uporabljam aplikacijo'}),
    h('ol',{class:'steps'},
      h('li',{text:'V razdelku Moj cilj zapiši cilj, minimalno različico in dneve.'}),
      h('li',{text:'Vsak dan označi, kako je šlo. Traja deset sekund.'}),
      h('li',{text:'V petek v razdelku Napredek kopiraj petkov status in ga pošlji, če želiš, da te Teja podpre pred koncem tedna.'}),
      h('li',{text:'V ponedeljek v razdelku Napredek kopiraj check-in in ga pošlji v skupino.'}),
      h('li',{text:'Shrani varnostno kodo, če ne želiš izgubiti podatkov ob menjavi telefona.'}))));
  out.push(h('section',{class:'card'},h('h3',{text:'Zasebnost'}),h('p',{class:'small',text:'Podatki ostanejo samo v tvojem brskalniku. Teja in skupina vidita samo to, kar sama pošlješ v check-inu.'})));
  out.push(h('section',{class:'card'},h('h3',{text:'Za trenerko'}),h('p',{class:'small muted',text:'Pogled za Tejo: pregled poročil skupine. Deluje samo na tej napravi in je prazen, dokler ne prilepiš sporočil.'}),
    h('button',{class:'btn alt sm',type:'button',onclick:()=>{C.on=!C.on;saveC();if(!C.on&&ui.tab==='trener')ui.tab='danes';render()}},C.on?'Izklopi pogled za trenerko':'Vklopi pogled za trenerko')));
  return out;
}

/* ---------- list za vnos preteklega dne ---------- */
function renderSheet(){
  const box=document.getElementById('sheet');box.replaceChildren();
  const day=ui.sheetDay;if(!day||!S.profile) return;
  const today=todayStr();const cur=S.log[day]||null;const d=parse(day);
  const close=()=>{ui.sheetDay=null;renderSheet()};
  const back=h('div',{class:'sheet-back',onclick:e=>{if(e.target===back)close()}});
  const choices=h('div',{class:'choices'});
  [['done','Cilj dosežen'],['min','Minimalna različica'],['rest','Počitek ali pavza'],['miss','Ni izvedeno']].forEach(([k,label])=>{
    choices.append(h('button',{class:'choice c-'+k,type:'button','aria-pressed':cur===k?'true':'false',onclick:()=>setDay(day,k)},h('i',{html:ICON[k],style:'display:contents'}),h('span',{text:label})));
  });
  const nf=noteField(day);
  const sheet=h('div',{class:'sheet',role:'dialog','aria-modal':'true','aria-label':'Vnos za dan'},
    h('h2',{text:DAYS_LONG[wd(day)].charAt(0).toUpperCase()+DAYS_LONG[wd(day)].slice(1)+', '+d.getDate()+'. '+(d.getMonth()+1)+'.'}),
    choices,nf,
    h('div',{class:'row'},cur?h('button',{class:'btn ghost sm',type:'button',onclick:()=>setDay(day,null)},'Počisti vnos'):h('span'),h('button',{class:'btn alt sm',type:'button',id:'sheet-close',onclick:close},'Zapri')));
  back.append(sheet);box.append(back);
  const first=sheet.querySelector('button');if(first)first.focus();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheetDay){ui.sheetDay=null;renderSheet()}});

/* ---------- glavni izris ---------- */
function render(){
  const today=todayStr();
  useGoal();
  renderHead(today);renderTabs();
  const app=document.getElementById('app');app.replaceChildren();
  const views={danes:viewToday,napredek:viewProgress,cilj:viewGoal,znanje:viewKnowledge,trener:viewCoach};
  (views[ui.tab]||viewToday)(today).forEach(n=>app.append(n));
  renderSheet();
}
render();
})();
</script>
